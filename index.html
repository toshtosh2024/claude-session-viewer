<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0eee9; --line: #e2dfd8;
  --text: #1f1e1c; --muted: #6e6b64; --faint: #9a968d;
  --accent: #c2410c; --accent-soft: #fbeee6;
  --user: #eef3fb; --user-line: #cfdcf0;
  --danger: #b42318; --danger-soft: #fdecea;
  --ok: #157f3b; --code: #f3f1ec;
  --shadow: 0 8px 30px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --panel: #1e1d1b; --panel-2: #262422; --line: #34312d;
    --text: #ece9e3; --muted: #a8a399; --faint: #7a766e;
    --accent: #f08a4b; --accent-soft: #3a2619;
    --user: #1d2533; --user-line: #2f3d55;
    --danger: #f2716a; --danger-soft: #3b1d1b;
    --ok: #4cc27a; --code: #2a2825;
    --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }

header {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .01em; }
.search { flex: 1 1 220px; min-width: 160px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 260px; }
.btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.stat { color: var(--muted); font-size: 12px; white-space: nowrap; }

main { flex: 1; display: grid; grid-template-columns: minmax(300px, 400px) 1fr; min-height: 0; }
#list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
.item {
  display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.item:hover { background: var(--panel-2); }
.item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item input { margin-top: 4px; width: 15px; height: 15px; accent-color: var(--danger); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .f { color: var(--muted); font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .m { color: var(--faint); font-size: 11.5px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; }
.badge.run { color: var(--ok); }
.empty { padding: 40px 20px; color: var(--muted); text-align: center; }

#view { overflow-y: auto; min-width: 0; }
.vhead {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 12px 24px;
}
.vhead h2 { margin: 0 0 2px; font-size: 17px; }
.vhead .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
.vhead .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.vhead label { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; cursor: pointer; }
.msgs { padding: 18px 24px 80px; max-width: 920px; }
.msg { margin: 0 0 14px; }
.msg .who { font-size: 11.5px; color: var(--faint); margin-bottom: 3px; }
.bubble { padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
.msg.user .bubble.text { background: var(--user); border-color: var(--user-line); }
.text-body { white-space: pre-wrap; }
.text-body pre { white-space: pre; overflow-x: auto; background: var(--code); padding: 8px 10px; border-radius: 6px; margin: 6px 0; font-size: 12.5px; }
.text-body code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
details.blk { margin: 4px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
details.blk > summary { padding: 5px 10px; cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; }
details.blk > summary::before { content: "▸ "; }
details.blk[open] > summary::before { content: "▾ "; }
details.blk pre { margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 480px; overflow-y: auto; }
details.blk.err > summary { color: var(--danger); }
.hide-tools .tool, .hide-thinking .thinking, .hide-meta .meta { display: none; }
.hide-tools .msg.only-tools { display: none; }
.placeholder { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 24px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 10; padding: 16px; }
.modal-bg.show { display: grid; }
.modal { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column; }
.modal h3 { margin: 0; padding: 16px 20px 6px; font-size: 16px; }
.modal p { margin: 0; padding: 0 20px 10px; color: var(--muted); font-size: 13px; }
.modal ul { margin: 0; padding: 0 20px 0 38px; overflow-y: auto; font-size: 13px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); margin-top: 10px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); display: none; max-width: calc(100% - 32px); z-index: 20; }
.toast.show { display: block; }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #list { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .vhead, .msgs { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Claude Sessions</h1>
  <input id="q" class="search" type="search" placeholder="タイトル・最初の発言・フォルダで絞り込み">
  <select id="proj"><option value="">すべてのフォルダ</option></select>
  <span class="stat" id="stat"></span>
  <button class="btn" id="selAll">表示中を全選択</button>
  <button class="btn" id="selNone">選択解除</button>
  <button class="btn danger" id="delSel" disabled>選択を削除</button>
  <button class="btn" id="reload" title="再読み込み">↻</button>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="placeholder">左の一覧からセッションを選ぶと、会話の全文がここに表示されます。</div></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <p>ゴミ箱（~/.Trash）に移動します。間違えた場合はゴミ箱から戻せます。</p>
    <ul id="mList"></ul>
    <div class="acts">
      <button class="btn" id="mCancel">キャンセル</button>
      <button class="btn danger solid" id="mOk">ゴミ箱に移動</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
let sessions = [], selected = new Set(), activeId = null, pending = [];
const viewOpts = { tools: false, thinking: false, meta: false };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, "Content-Type": "application/json" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
  if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + "分前";
  if (diff < 86400) return Math.round(diff / 3600) + "時間前";
  return d.toLocaleString("ja-JP", { year: d.getFullYear() === now.getFullYear() ? undefined : "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
const shortCwd = c => (c || "").replace(/^\/Users\/[^/]+/, "~");
const label = s => s.title || (s.first ? s.first.slice(0, 60) : "(発言なし)");

function md(text) {
  const parts = esc(text).split(/```/);
  return parts.map((p, i) => i % 2
    ? "<pre>" + p.replace(/^[\w+-]*\n/, "") + "</pre>"
    : p.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
  ).join("");
}

function filtered() {
  const q = $("#q").value.trim().toLowerCase(), p = $("#proj").value;
  return sessions.filter(s => (!p || s.cwd === p) &&
    (!q || [s.title, s.first, s.cwd, s.id].some(v => (v || "").toLowerCase().includes(q))));
}

function renderList() {
  const list = filtered();
  const total = sessions.reduce((a, s) => a + s.size, 0);
  $("#stat").textContent = `${list.length} / ${sessions.length} 件・合計 ${fmtSize(total)}`;
  const n = [...selected].filter(id => sessions.some(s => s.id === id)).length;
  $("#delSel").disabled = !n;
  $("#delSel").textContent = n ? `選択を削除（${n}）` : "選択を削除";
  if (!list.length) { $("#list").innerHTML = '<div class="empty">該当するセッションはありません</div>'; return; }
  $("#list").innerHTML = list.map(s => `
    <div class="item ${s.id === activeId ? "active" : ""}" data-id="${s.id}">
      <input type="checkbox" ${selected.has(s.id) ? "checked" : ""} ${s.running ? "disabled title='実行中は削除できません'" : ""}>
      <div style="min-width:0">
        <div class="t">${esc(label(s))}</div>
        ${s.title && s.first ? `<div class="f">${esc(s.first)}</div>` : ""}
        <div class="m">
          ${s.running ? '<span class="badge run">実行中</span>' : ""}
          <span>${esc(fmtDate(s.updated))}</span>
          <span>${esc(shortCwd(s.cwd))}</span>
          <span>${s.userTurns}往復</span>
          <span>${fmtSize(s.size)}</span>
        </div>
      </div>
    </div>`).join("");
}

function renderProjects() {
  const cur = $("#proj").value;
  const counts = {};
  sessions.forEach(s => counts[s.cwd] = (counts[s.cwd] || 0) + 1);
  $("#proj").innerHTML = '<option value="">すべてのフォルダ</option>' +
    Object.keys(counts).sort().map(c => `<option value="${esc(c)}">${esc(shortCwd(c))} (${counts[c]})</option>`).join("");
  $("#proj").value = counts[cur] ? cur : "";
}

async function load() {
  sessions = await api("/api/sessions");
  selected = new Set([...selected].filter(id => sessions.some(s => s.id === id && !s.running)));
  renderProjects(); renderList();
}

function blockHtml(b) {
  if (b.kind === "text") return `<div class="bubble text"><div class="text-body">${md(b.text)}</div></div>`;
  if (b.kind === "thinking") return `<details class="blk thinking"><summary>思考</summary><pre>${esc(b.text)}</pre></details>`;
  if (b.kind === "meta") return `<details class="blk meta"><summary>システム／コマンド</summary><pre>${esc(b.text)}</pre></details>`;
  if (b.kind === "tool_use") return `<details class="blk tool"><summary>ツール: ${esc(b.name)}</summary><pre>${esc(b.text)}</pre></details>`;
  if (b.kind === "tool_result") return `<details class="blk tool ${b.error ? "err" : ""}"><summary>${b.error ? "ツール結果（エラー）" : "ツール結果"}</summary><pre>${esc(b.text)}</pre></details>`;
  return "";
}

async function openSession(id) {
  activeId = id; renderList();
  const s = sessions.find(x => x.id === id);
  $("#view").innerHTML = '<div class="placeholder">読み込み中…</div>';
  let data;
  try { data = await api("/api/session?id=" + id); }
  catch { $("#view").innerHTML = '<div class="placeholder">読み込めませんでした</div>'; return; }
  if (activeId !== id) return;
  const msgs = data.messages.map(m => {
    const visible = m.blocks.some(b => b.kind === "text");
    return `<div class="msg ${m.role} ${visible ? "" : "only-tools"}">
      <div class="who">${m.role === "user" ? "あなた" : "Claude"}${m.sidechain ? "（サブエージェント）" : ""} · ${esc(fmtDate(m.time))}</div>
      ${m.blocks.map(blockHtml).join("")}
    </div>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="vhead">
      <h2>${esc(label(s))}</h2>
      <div class="sub">${esc(shortCwd(s.cwd))} · ${esc(s.id)} · ${fmtSize(s.size)}${s.subagents ? ` · サブエージェント ${s.subagents}件` : ""}</div>
      <div class="row">
        <label><input type="checkbox" data-opt="tools" ${viewOpts.tools ? "checked" : ""}>ツール</label>
        <label><input type="checkbox" data-opt="thinking" ${viewOpts.thinking ? "checked" : ""}>思考</label>
        <label><input type="checkbox" data-opt="meta" ${viewOpts.meta ? "checked" : ""}>システム</label>
        <span style="flex:1"></span>
        <button class="btn danger" id="delOne" ${s.running ? "disabled title='実行中は削除できません'" : ""}>このセッションを削除</button>
      </div>
    </div>
    <div class="msgs ${classes()}">${msgs || '<div class="placeholder">表示できる発言がありません</div>'}</div>`;
  $("#view").scrollTop = 0;
}
const classes = () => ["tools", "thinking", "meta"].filter(k => !viewOpts[k]).map(k => "hide-" + k).join(" ");

function confirmDelete(ids) {
  pending = ids;
  $("#mTitle").textContent = `${ids.length}件のセッションを削除しますか？`;
  $("#mList").innerHTML = ids.map(id => `<li>${esc(label(sessions.find(s => s.id === id)))}</li>`).join("");
  $("#modal").classList.add("show");
  $("#mOk").focus();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 6000);
}

$("#list").addEventListener("click", e => {
  const item = e.target.closest(".item"); if (!item) return;
  const id = item.dataset.id;
  if (e.target.matches("input[type=checkbox]")) {
    e.target.checked ? selected.add(id) : selected.delete(id); renderList(); return;
  }
  openSession(id);
});
$("#view").addEventListener("change", e => {
  const k = e.target.dataset.opt; if (!k) return;
  viewOpts[k] = e.target.checked;
  const m = $(".msgs"); if (m) m.className = "msgs " + classes();
});
$("#view").addEventListener("click", e => { if (e.target.id === "delOne") confirmDelete([activeId]); });
$("#q").addEventListener("input", renderList);
$("#proj").addEventListener("change", renderList);
$("#selAll").onclick = () => { filtered().forEach(s => !s.running && selected.add(s.id)); renderList(); };
$("#selNone").onclick = () => { selected.clear(); renderList(); };
$("#delSel").onclick = () => confirmDelete([...selected]);
$("#reload").onclick = load;
$("#mCancel").onclick = () => $("#modal").classList.remove("show");
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") $("#modal").classList.remove("show"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").classList.remove("show"); });
$("#mOk").onclick = async () => {
  $("#modal").classList.remove("show");
  const res = await api("/api/delete", { method: "POST", body: JSON.stringify({ ids: pending }) });
  const ok = res.results.filter(r => r.ok).length, ng = res.results.filter(r => !r.ok);
  pending.forEach(id => selected.delete(id));
  if (pending.includes(activeId)) { activeId = null; $("#view").innerHTML = '<div class="placeholder">削除しました</div>'; }
  await load();
  toast(`${ok}件をゴミ箱に移動しました` + (ng.length ? `（${ng.length}件は削除できず: ${ng.map(r => r.reason).join(", ")}）` : "") + (res.trash ? `  →  ${res.trash.replace(/^\/Users\/[^/]+/, "~")}` : ""));
};

load().catch(() => { $("#list").innerHTML = '<div class="empty">読み込みに失敗しました。サーバーが動いているか確認してください。</div>'; });
</script>
</body>
</html>
